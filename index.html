<title>Menú digital · Mariscos La Marea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<script>
/* ╔══════════════════════════════════════════════════════════════════╗
   ║  1) DATOS DEL NEGOCIO — lo único que cambias por cliente          ║
   ╚══════════════════════════════════════════════════════════════════╝ */
var CONFIG = {

  logoEmoji: "🦐",                          // o pon una imagen en logoImg
  logoImg: "img/logo.svg",
  heroImg: "",                              // foto de fondo detrás del título (opcional)

  heroPegado: false,                        // true = pegado a la orilla derecha (foto cortada) · false = flotando completo
  heroSalsa: null,                          // chorros animados sobre heroArte; null = sin animación
  whatsapp: "526673473354",                 // número que recibe los pedidos (52 + 10 dígitos)
  costoEnvio: 35,                           // número fijo, o null = "por confirmar según ubicación"
  pedidoMinimo: 150,                        // 0 = sin mínimo
  zonaHoraria: "America/Mazatlan",
  bloquearCerrado: false,                   // DEMO: false para que se pueda probar a cualquier hora
  // 0=Dom 1=Lun ... 6=Sáb · null = cerrado ese día · "24:00" = medianoche
  horario: {
    0: ["10:00", "18:00"],
    1: null,
    2: ["10:00", "18:00"],
    3: ["10:00", "18:00"],
    4: ["10:00", "18:00"],
    5: ["10:00", "19:00"],
    6: ["10:00", "19:00"]
  },
  direccion: "Blvd. Francisco I. Madero 1234, Col. Centro, Culiacán, Sin. (demo)",
  mapsUrl: "https://maps.google.com/?q=Culiacan,Sinaloa",
  mapaBusqueda: "Centro, Culiacán, Sinaloa",
  instagram: "https://www.instagram.com/evanlux.ia/",
  tiktok: "https://www.tiktok.com/@evanlux.ia",
  transferencia: {
    banco: "Cuenta de ejemplo",
    titular: "DEMO · no transferir",
    clabe: "012345678901234567"
  },
  // textos que corren en las cintas cruzadas debajo de la portada
  cintas: {
    amarilla: ["Aguachiles", "Torres", "Tostadas", "Zarandeados", "Cócteles", "Pide por WhatsApp"],
    roja: ["Puro mar", "Recién preparado", "Bien frío", "Efectivo o transferencia", "A domicilio"]
  },
  // barra de demo arriba y crédito abajo (null en menús de clientes reales)
  demo: {
    texto: "Menú demo · ¿Quieres uno así para tu negocio?",
    whatsapp: "526673473354",
    marca: "Evan Lux",
    mensaje: "Hola Evan, vi el demo del menú digital de Mariscos La Marea y me interesa uno para mi negocio."
  },
  colores: {
    fondo: "#061419",
    superficie: "#0c222b",
    acento: "#4FE0D2",     // turquesa de mar para etiquetas y detalles
    cta: "#FF6A3D"         // coral de camarón para botones y precios
  }
};

/* ╔══════════════════════════════════════════════════════════════════╗
   ║  2) MENÚ — agregar, quitar o editar platillos aquí                ║
   ║  campos: n (nombre), d (descripción), p (precio), img (foto),     ║
   ║  badge ("Favorito", "Nuevo"...), nota, agotado: true,             ║
   ║  sugerido: true (sale en "¿Le agregas algo más?"),                ║
   ║  opciones: [{t:"Proteína", c:[{n:"Res"},{n:"Camarón", x:20}]}]    ║
   ║  extras:  [{n:"Empanizar", x:15}]  (se pueden marcar varios)      ║
   ╚══════════════════════════════════════════════════════════════════╝ */
// Extras que se le pueden agregar a aguachiles, ceviches y cócteles
var EXTRAS = [
  { n: "Callo de hacha", x: 90 }, { n: "Pulpo", x: 50 }, { n: "Camarón extra", x: 45 },
  { n: "Aguacate", x: 20 }, { n: "Tostadas extra", x: 15 }
];
var TAMANO = [{ t: "Tamaño", c: [{ n: "Media orden" }, { n: "Orden completa", x: 90 }] }];

var MENU = [
  { id: "favoritos", t: "Favoritos", label: "Los más pedidos", intro: "Lo que nos piden todos los días.", items: [
    { n: "Aguachile La Marea", e: "🦐", badge: "Favorito", p: 240, img: "img/aguachile.jpg", d: "Camarón crudo curtido en limón con pepino, cebolla morada y chiltepín. Elige tu salsa.", opciones: [{ t: "Salsa", c: [{ n: "Verde (chiltepín y cilantro)" }, { n: "Rojo (chiles secos)" }, { n: "Negro (salsas negras)", x: 20 }] }], extras: EXTRAS },
    { n: "Torre La Marea", e: "🗼", badge: "Favorito", p: 320, img: "img/torre-mariscos.jpg", d: "Capas de camarón, pulpo, callo y pepino en salsa negra, coronada con aguacate. Para compartir.", extras: EXTRAS },
    { n: "Camarones zarandeados", e: "🔥", badge: "Nuevo", p: 280, nota: "500 g", img: "img/camarones-zarandeados.jpg", d: "Camarones abiertos y asados al carbón con salsa zarandeada. Con arroz y ensalada." }
  ]},
  { id: "tostadas", t: "Tostadas y ceviches", label: "Para abrir boca", intro: "Recién preparados, nunca de ayer.", items: [
    { n: "Tostada de ceviche", e: "🐟", p: 65, img: "img/tostada-ceviche.jpg", d: "Ceviche de pescado con jitomate, cebolla, cilantro y aguacate." },
    { n: "Tostada de camarón", e: "🦐", p: 80, img: "img/tostada-camaron.jpg", d: "Camarón cocido picado, pepino, cebolla morada y salsa de la casa." },
    { n: "Tostada de atún", e: "🍣", p: 95, img: "img/tostada-atun.jpg", d: "Atún fresco en cubos, aguacate, cebolla morada y aderezo de chipotle." },
    { n: "Ceviche de camarón", e: "🥗", p: 180, img: "img/ceviche-camaron.jpg", d: "Camarón curtido con jitomate, pepino, cebolla y cilantro. Con tostadas.", opciones: TAMANO, extras: EXTRAS }
  ]},
  { id: "cocteles", t: "Cócteles", label: "Bien fríos", intro: "Con su salsa de la casa y galletas saladas.", items: [
    { n: "Cóctel de camarón", e: "🍤", p: 170, img: "img/coctel-camaron.jpg", d: "Camarón cocido en salsa de cóctel con aguacate, cebolla y cilantro.", opciones: [{ t: "Tamaño", c: [{ n: "Chico" }, { n: "Grande", x: 60 }] }], extras: EXTRAS },
    { n: "Campechana", e: "🥂", p: 220, img: "img/campechana.jpg", d: "Camarón, pulpo y callo en salsa de cóctel con aguacate.", opciones: [{ t: "Tamaño", c: [{ n: "Chico" }, { n: "Grande", x: 70 }] }], extras: EXTRAS }
  ]},
  { id: "calientes", t: "Calientes", label: "De la plancha y el comal", intro: "Con arroz, ensalada y tortillas.", items: [
    { n: "Camarones a la diabla", e: "🌶️", p: 240, img: "img/camarones-diabla.jpg", d: "Camarones en salsa diabla de chiles secos. Picosos de verdad." },
    { n: "Camarones al mojo de ajo", e: "🧄", p: 240, img: "img/camarones-mojo.jpg", d: "Camarones salteados en mantequilla con ajo dorado y perejil." },
    { n: "Camarones empanizados", e: "🍤", p: 230, img: "img/camarones-empanizados.jpg", d: "Camarones empanizados y dorados, con aderezo de chipotle." },
    { n: "Pescado zarandeado", e: "🐠", p: 390, nota: "1 kg aprox.", img: "img/pescado-zarandeado.jpg", d: "Pescado entero abierto, asado al carbón con salsa zarandeada. Para 2 o 3 personas." },
    { n: "Filete empanizado", e: "🐟", p: 190, img: "img/filete-empanizado.jpg", d: "Filete de pescado empanizado con papas a la francesa y ensalada." }
  ]},
  { id: "tacos", t: "Tacos", label: "Para el antojo", intro: "Orden de 3 tacos.", items: [
    { n: "Tacos gobernador", e: "🌮", p: 150, nota: "3 piezas", img: "img/tacos-gobernador.jpg", d: "Tortilla de maíz dorada con camarón guisado, queso gratinado y chile poblano." },
    { n: "Tacos de pescado", e: "🌮", p: 130, nota: "3 piezas", img: "img/tacos-pescado.jpg", d: "Pescado capeado estilo Ensenada con col, crema y pico de gallo." }
  ]},
  { id: "bebidas", t: "Bebidas", label: "Pa' la sed", intro: "", items: [
    { n: "Clamato preparado", e: "🍹", p: 70, sugerido: true, img: "img/clamato.jpg", d: "Clamato con limón, salsas y chile. Escarchado con chamoy." },
    { n: "Limonada", e: "🍋", p: 40, sugerido: true, img: "img/limonada.jpg", d: "1 litro. Natural o mineral.", opciones: [{ t: "Tipo", c: [{ n: "Natural" }, { n: "Mineral" }] }] },
    { n: "Agua de jamaica", e: "🌺", p: 35, sugerido: true, img: "img/agua-jamaica.jpg", d: "1 litro, hecha en casa." },
    { n: "Refresco", e: "🥤", p: 35, img: "img/refresco.jpg", d: "600 ml.", opciones: [{ t: "Sabor", c: [{ n: "Coca-Cola" }, { n: "Sprite" }, { n: "Fanta" }, { n: "Fresca" }] }] }
  ]}
];
</script>
<style>
:root{
  --bg:#0b0b0b; --surf:#161616; --surf2:#1e1e1e; --acc:#FFC93C; --cta:#E8323C;
  --txt:#F5F5F5; --dim:rgba(245,245,245,.72); --muted:#9a9a9a;
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.12);
  --r:18px; --ease:cubic-bezier(.23,1,.32,1);
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:120px}
body{background:var(--bg);color:var(--txt);font-family:Montserrat,system-ui,sans-serif;font-size:15px;line-height:1.5;overflow-x:hidden}
body.lock{overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:var(--txt)}
.wrap{max-width:720px;margin:0 auto;padding:0 18px}
.bebas{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.08em}

/* ── HERO ── */
.hero{position:relative;min-height:88vh;padding:calc(18px + var(--safe-t)) 0 40px;overflow:hidden;
  background:radial-gradient(120% 70% at 85% 95%,rgba(232,50,60,.28),transparent 60%),radial-gradient(80% 50% at 10% 0%,rgba(255,201,60,.10),transparent 60%),var(--bg)}
.hero-img{position:absolute;inset:0;background-size:cover;background-position:center 70%;opacity:.55}
.hero-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--bg) 0%,rgba(11,11,11,.55) 45%,var(--bg) 100%)}
.hero-art{position:absolute;right:-40px;bottom:-30px;font-size:260px;line-height:1;filter:drop-shadow(0 30px 60px rgba(0,0,0,.6));transform:rotate(-14deg);opacity:.9;pointer-events:none;animation:flotar 6s ease-in-out infinite}
@keyframes flotar{50%{transform:rotate(-10deg) translateY(-12px)}}
.hero .wrap{position:relative;z-index:2}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start}
.logo{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;font-size:48px;background:radial-gradient(circle at 35% 30%,#2a2a2a,#121212);border:2px solid var(--acc);box-shadow:0 0 0 6px rgba(255,201,60,.08),0 12px 30px rgba(0,0,0,.5);overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.pill-link{border:1.5px solid var(--cta);color:#fff;border-radius:10px;padding:8px 14px;font-size:15px;text-decoration:none}
.eyebrow{margin-top:34px;font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--dim);font-weight:600}
.brand{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;color:var(--cta);font-size:22px;letter-spacing:.14em;margin-top:6px}
.h1{font-family:"Archivo Black",Impact,"Arial Black",sans-serif,sans-serif;font-size:clamp(52px,15vw,96px);line-height:.95;letter-spacing:-.01em;margin-top:4px}
.h1 .l2{background:linear-gradient(90deg,var(--acc),#ffb02e);-webkit-background-clip:text;background-clip:text;color:transparent}
.h1 .dot{color:var(--cta)}
.sub{font-size:18px;color:var(--dim);margin-top:14px;max-width:420px}
.status{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:22px;font-size:14px;color:var(--dim)}
.status .d{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:7px;background:#e33}
.status .d.on{background:#2ecc71;box-shadow:0 0 0 0 rgba(46,204,113,.7);animation:pulso 1.8s infinite}
@keyframes pulso{70%{box-shadow:0 0 0 9px rgba(46,204,113,0)}100%{box-shadow:0 0 0 0 rgba(46,204,113,0)}}
.hero-cta{display:inline-flex;align-items:center;gap:10px;margin-top:30px;background:var(--cta);color:#fff;border-radius:999px;padding:15px 26px;font-size:19px;box-shadow:0 10px 30px rgba(232,50,60,.35);text-decoration:none}

/* ── NAV CATEGORÍAS ── */
.nav{position:sticky;top:0;z-index:30;background:rgba(11,11,11,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.nav-in{display:flex;align-items:center;gap:12px}
.nav-logo{font-size:26px;flex:none;display:grid;place-items:center}
.nav-logo img{width:38px;height:38px;border-radius:50%;object-fit:cover;display:block;box-shadow:0 0 0 2px color-mix(in srgb,var(--acc) 45%,transparent)}
.cats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:12px 6px;scroll-behavior:smooth}
.cats::-webkit-scrollbar{display:none}
.cat{flex:none;font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.1em;font-size:17px;padding:7px 14px;border-radius:999px;color:var(--dim);border:1px solid transparent;white-space:nowrap;transition:.2s;text-decoration:none}
.cat.on{color:#111;background:var(--acc)}

/* ── SECCIONES ── */
section.sec{padding:46px 0 10px}
.sec-label{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.2em;color:var(--cta);font-size:15px}
.sec-title{font-family:"Archivo Black",Impact,"Arial Black",sans-serif;font-size:34px;line-height:1.05;margin-top:2px}
.sec-line{width:46px;height:4px;border-radius:4px;background:var(--acc);margin:12px 0 8px}
.sec-intro{color:var(--muted);font-size:14px;margin-bottom:18px}
.grid{display:grid;gap:14px}
@media(min-width:640px){.grid{grid-template-columns:1fr 1fr}}
.item{position:relative;display:grid;grid-template-columns:112px 1fr;gap:14px;padding:14px;border-radius:var(--r);background:linear-gradient(160deg,var(--surf2),var(--surf));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.35);opacity:0;transform:translateY(18px);transition:opacity .6s var(--ease),transform .6s var(--ease)}
.item.vis{opacity:1;transform:none}
.item.fav{border-color:rgba(255,201,60,.35)}
.thumb{width:112px;height:112px;border-radius:14px;overflow:hidden;display:grid;place-items:center;font-size:56px;background:radial-gradient(circle at 40% 35%,#2b2b2b,#111);box-shadow:0 8px 20px rgba(0,0,0,.45)}
.thumb img{width:100%;height:100%;object-fit:cover}
.info{display:flex;flex-direction:column;min-width:0}
.badge{align-self:flex-start;font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.12em;font-size:13px;color:#111;background:var(--acc);border-radius:6px;padding:2px 8px;margin-bottom:6px}
.badge.nuevo{background:var(--cta);color:#fff}
.iname{font-family:"Archivo Black",Impact,"Arial Black",sans-serif;font-size:17px;line-height:1.15}
.inote{font-size:12px;color:var(--acc);margin-top:3px;font-weight:600}
.idesc{font-size:13px;color:var(--dim);margin-top:5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.irow{display:flex;align-items:center;justify-content:space-between;margin-top:auto;padding-top:10px}
.price{font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:24px;color:var(--cta);letter-spacing:.03em}
.add{width:42px;height:42px;border-radius:12px;background:var(--cta);color:#fff;font-size:26px;line-height:1;display:grid;place-items:center;box-shadow:0 8px 20px rgba(232,50,60,.35);transition:transform .15s}
.add:active{transform:scale(.9)}
.item.out{opacity:.55}
.item.out .add{background:#333;box-shadow:none;font-size:11px;font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.06em;width:auto;padding:0 10px}
.plus1{position:fixed;z-index:80;pointer-events:none;font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;font-size:22px;color:#111;background:var(--acc);border-radius:999px;padding:4px 10px;animation:sube .8s var(--ease) forwards}
@keyframes sube{to{transform:translateY(-60px) scale(1.2);opacity:0}}

/* ── INFO / FOOTER ── */
.info-box{margin:50px 0 0;padding:22px;border-radius:var(--r);background:var(--surf);border:1px solid var(--line)}
.info-box h3{font-family:"Archivo Black",Impact,"Arial Black",sans-serif;font-size:22px;margin-bottom:12px}
.hrs{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:14px;color:var(--dim)}
.hrs .hoy{color:var(--acc);font-weight:700}
.links{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
.chip{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:999px;padding:9px 15px;font-size:14px;color:var(--txt);text-decoration:none}
footer{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.12em;padding:40px 0 calc(130px + var(--safe-b))}

/* ── BARRA FLOTANTE ── */
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + var(--safe-b));z-index:40;max-width:696px;margin:0 auto;display:flex;align-items:center;gap:12px;background:var(--cta);color:#fff;border-radius:18px;padding:12px 12px 12px 16px;box-shadow:0 14px 40px rgba(232,50,60,.4);transform:translateY(140%);transition:transform .4s var(--ease)}
.bar.show{transform:none}
.bar .n{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#111;display:grid;place-items:center;font-weight:700}
.bar .t{flex:1;font-weight:600;font-size:16px;text-align:left}
.bar .tot{background:rgba(0,0,0,.22);border-radius:12px;padding:8px 14px;font-weight:700}
.bar.bump{animation:bump .35s}
@keyframes bump{40%{transform:scale(1.04)}}

/* ── TOAST ── */
.toast{position:fixed;left:50%;bottom:calc(92px + var(--safe-b));z-index:90;transform:translate(-50%,20px);opacity:0;background:#222;border:1px solid var(--line2);color:#fff;font-family:"Bebas Neue",Impact,"Arial Narrow",sans-serif;letter-spacing:.08em;font-size:17px;padding:10px 18px;border-radius:12px;transition:.3s var(--ease);pointer-events:none;white-space:nowrap}
body.lock .toast{bottom:auto;top:calc(16px + var(--safe-t));z-index:95}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ── HOJAS (ficha y carrito) ── */
.ov{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .3s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:70;max-width:720px;margin:0 auto;max-height:92vh;display:flex;flex-direction:column;background:#121212;border-radius:24px 24px 0 0;border-top:2px solid var(--cta);transform:translateY(105%);transition:transform .42s var(--ease);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.sheet.show{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:#3a3a3a;margin:10px auto 0;flex:none}
.sh-head{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 6px;flex:none}
.sh-head h2{font-family:"Archivo Black",Impact,"Arial Black",sans-serif;font-size:24px}
.x{width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);font-size:18px}
.sh-body{overflow-y:auto;padding:6px 20px 20px;flex:1 1 auto;min-height:0;-webkit-overflow-scrolling:touch}
.sh-foot{flex:none;padding:12px 20px calc(16px + var(--safe-b));border-top:1px solid var(--line);background:#121212}

/* ficha */
.f-img{height:210px;border-radius:18px;display:grid;place-items:center;font-size:110px;background:radial-gradient(circle at 40% 35%,#2b2b2b,#0f0f0f);overflow:hidden;margin-top:4px}
.f-img img{width:100%;height:100%;object-fit:cover}
.f-name{font-family:"Archivo Black",Impact,"Arial Black",sans-serif;font-size:24px;margin-top:16px;line-height:1.1}

/* ═════════ EFECTOS ═════════ */
.fx-prog{position:fixed;top:0;left:0;right:0;height:3px;z-index:100;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(90deg,var(--acc),var(--cta))}
.hero{isolation:isolate}
.aurora{position:absolute;inset:-10%;z-index:-2;pointer-events:none;filter:blur(70px);opacity:.55}
.aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;animation:flota 18s ease-in-out infinite}
.aurora i:nth-child(1){width:70vw;height:70vw;max-width:520px;max-height:520px;left:-15vw;top:5%;background:radial-gradient(circle,color-mix(in srgb,var(--cta) 75%,transparent),transparent 65%)}
.aurora i:nth-child(2){width:60vw;height:60vw;max-width:460px;max-height:460px;right:-10vw;top:-8%;background:radial-gradient(circle,color-mix(in srgb,var(--acc) 55%,transparent),transparent 65%);animation-delay:-6s;animation-duration:22s}
.aurora i:nth-child(3){width:55vw;height:55vw;max-width:420px;max-height:420px;left:30%;bottom:-15%;background:radial-gradient(circle,color-mix(in srgb,var(--cta) 45%,transparent),transparent 65%);animation-delay:-11s}
@keyframes flota{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(4vw,-3vw) scale(1.08)}66%{transform:translate(-3vw,3vw) scale(.94)}}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(420px circle at var(--mx,70%) var(--my,30%),color-mix(in srgb,var(--acc) 12%,transparent),transparent 60%)}
#chispas{position:absolute;inset:0;z-index:-1;pointer-events:none;width:100%;height:100%}

.hero-art span{display:inline-block;transition:transform .25s ease-out}
.hero-art img{display:block;width:min(56vw,380px);height:auto}
.hero-art.foto{right:0;bottom:-30px;transform:none;animation:flotaFoto 6s ease-in-out infinite}
@keyframes flotaFoto{50%{translate:0 -10px}}
.hero-art.foto span{position:relative;filter:drop-shadow(0 30px 45px rgba(0,0,0,.6))}

@media(max-width:899px){.hero:has(.hero-art.foto.libre){padding-bottom:calc(min(74vw,400px) * .62 + 20px)}}

/* salsa animada */
.salsa{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}

@keyframes brillo{0%,100%{background-position:0 0}50%{background-position:100% 0}}
.sec-title{background:linear-gradient(100deg,var(--txt) 0%,var(--acc) 45%,var(--txt) 90%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brillo 9s ease-in-out infinite}

.sec.vis .sec-title{transition-delay:.08s}.sec.vis .sec-line{transition-delay:.16s;width:46px}.sec.vis .sec-intro{transition-delay:.22s}

.hero-cta{position:relative;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}

.btn{position:relative;overflow:hidden}

.cintas{position:relative;height:120px;overflow:hidden;margin:-40px 0 -10px;z-index:3;pointer-events:none}

.item{cursor:pointer;overflow:hidden;transition:opacity .6s var(--ease),transform .6s var(--ease),border-color .3s,box-shadow .3s}
.item::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--x,50%) var(--y,50%),color-mix(in srgb,var(--acc) 13%,transparent),transparent 60%)}
.item::after{content:"";position:absolute;top:0;bottom:0;width:50%;left:-80%;transform:skewX(-20deg);background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);pointer-events:none}
.thumb{transition:transform .5s var(--ease),box-shadow .5s}

.badge{position:relative;overflow:hidden}

.ghost{position:fixed;z-index:75;border-radius:14px;overflow:hidden;display:grid;place-items:center;background:radial-gradient(circle at 40% 35%,#2b2b2b,#0f0f0f);pointer-events:none;transition:all .45s cubic-bezier(.23,1,.32,1);box-shadow:0 20px 50px rgba(0,0,0,.6)}

<body>

<div class="fx-prog" id="prog"></div>

<!-- HERO -->
<header class="hero">
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i></div>
  <canvas id="chispas" aria-hidden="true"></canvas>
  <div class="hero-img" id="heroImg" hidden></div>
  <div class="hero-art" id="heroArt"></div>
  <div class="wrap">
    <div class="hero-top">
      <div class="logo" id="logo"></div>
      <a class="pill-link bebas" href="#favoritos">Ver menú</a>
    </div>
    <div class="eyebrow" id="eyebrow"></div>
    <div class="brand" id="brand"></div>
    <h1 class="h1" id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="status" id="status"></div>
    <a class="hero-cta bebas" href="#favoritos">Hacer mi pedido <span>›</span></a>
  </div>
</header>
<div class="cintas" aria-hidden="true"><div class="cinta a" id="cintaA"></div><div class="cinta r" id="cintaR"></div></div>

<!-- NAV -->
<nav class="nav"><div class="wrap nav-in"><span class="nav-logo" id="navLogo"></span><div class="cats" id="cats"></div></div></nav>

<main class="wrap" id="menu"></main>

<div class="wrap">
  <div class="info-box">
    <h3>Horario</h3>
    <div class="hrs" id="hrs"></div>
    <p style="margin-top:16px;color:var(--dim);font-size:14px" id="dir"></p>
    <div class="links" id="links"></div>
  </div>
</div>
<footer id="foot"></footer>

<!-- BARRA FLOTANTE -->
<button class="bar" id="bar" onclick="abrirCarrito()"><span class="n" id="barN">0</span><span class="t">Ver mi pedido</span><span class="tot" id="barT">$0</span></button>
<div class="toast" id="toast"></div>

<div class="ov" id="ov" onclick="cerrarTodo()"></div>

<!-- FICHA DE PLATILLO -->
<div class="sheet" id="ficha" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="f-media" id="fMedia"></div>
  <div class="sh-head"><span></span><button class="x" onclick="cerrarTodo()" aria-label="Cerrar">✕</button></div>
  <div class="sh-body f-body" id="fBody"></div>
  <div class="sh-foot f-foot">
    <div class="qty"><button onclick="fQty(-1)">−</button><span id="fQ">1</span><button onclick="fQty(1)">+</button></div>
    <button class="btn" id="fAdd" onclick="fAgregar()">Agregar</button>
  </div>
</div>

<!-- CARRITO -->
<div class="sheet" id="cart" role="dialog" aria-modal="true">
  <div class="grab"></div>
  <div class="sh-head"><h2>Tu orden</h2><button class="x" onclick="cerrarTodo()" aria-label="Cerrar">✕</button></div>
  <div class="sh-body" id="cBody"></div>
  <div class="sh-foot" id="cFoot"></div>
</div>

<script>
/* ═════════ UTILIDADES ═════════ */
var $ = function (id) { return document.getElementById(id); };
var money = function (n) { return "$" + Number(n).toLocaleString("es-MX"); };
var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); };
var store = {
  get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
var ITEMS = {};
MENU.forEach(function (cat) { cat.items.forEach(function (it) { ITEMS[it.n] = it; }); });
function foto(it) { var e = esc(it.e || "🍽️"); return it.img ? '<img src="' + esc(it.img) + '" alt="' + esc(it.n) + '" loading="lazy" data-e="' + e + '" onerror="this.outerHTML=this.dataset.e">' : e; }

/* ═════════ COLORES ═════════ */
(function () {
  var c = CONFIG.colores, r = document.documentElement.style;
  r.setProperty("--bg", c.fondo); r.setProperty("--surf", c.superficie);
  r.setProperty("--acc", c.acento); r.setProperty("--cta", c.cta);
})();

/* ═════════ HORARIO ═════════ */
var DIAS = ["Domingo", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes", "Sábado"];
function ahora() {
  var p = new Intl.DateTimeFormat("en-US", { timeZone: CONFIG.zonaHoraria, weekday: "short", hour: "2-digit", minute: "2-digit", hour12: false }).formatToParts(new Date());
  var o = {}; p.forEach(function (x) { o[x.type] = x.value; });
  return { dia: ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"].indexOf(o.weekday), min: (+o.hour % 24) * 60 + +o.minute };
}
function aMin(h) { var p = h.split(":"); return +p[0] * 60 + +p[1]; }
function bonita(h) { var p = h.split(":"), H = +p[0] % 24; return (H % 12 || 12) + ":" + p[1] + (H < 12 ? " am" : " pm"); }
function estado() {
  var a = ahora(), h = CONFIG.horario[a.dia];
  if (h && a.min >= aMin(h[0]) && a.min < aMin(h[1])) return { abierto: true, txt: "Cierra a las " + bonita(h[1]) };
  if (h && a.min < aMin(h[0])) return { abierto: false, txt: "Abrimos hoy a las " + bonita(h[0]) };
  for (var i = 1; i <= 7; i++) {
    var d = (a.dia + i) % 7, hh = CONFIG.horario[d];
    if (hh) return { abierto: false, txt: "Abrimos " + (i === 1 ? "mañana" : "el " + DIAS[d].toLowerCase()) + " a las " + bonita(hh[0]) };
  }
  return { abierto: false, txt: "" };
}
function pintarEstado() {
  var e = estado();
  $("status").innerHTML = '<span><span class="d' + (e.abierto ? " on" : "") + '"></span>' + (e.abierto ? "Abierto ahora" : "Cerrado") + "</span><span>🕑 " + e.txt + "</span>";
  var hoy = ahora().dia;
  $("hrs").innerHTML = [1, 2, 3, 4, 5, 6, 0].map(function (d) {
    var h = CONFIG.horario[d], c = d === hoy ? ' class="hoy"' : "";
    return "<span" + c + ">" + DIAS[d] + "</span><span" + c + ">" + (h ? bonita(h[0]) + " – " + bonita(h[1]) : "Cerrado") + "</span>";
  }).join("");
}

/* ═════════ PINTAR PÁGINA ═════════ */
function pintar() {
  var logo = CONFIG.logoImg ? '<img src="' + esc(CONFIG.logoImg) + '" alt="' + esc(CONFIG.nombre) + '">' : CONFIG.logoEmoji;
  $("logo").innerHTML = logo; $("navLogo").innerHTML = CONFIG.logoImg ? '<img src="' + esc(CONFIG.logoImg) + '" alt="' + esc(CONFIG.nombre) + '">' : CONFIG.logoEmoji;
  if (CONFIG.heroImg) { $("heroImg").hidden = false; $("heroImg").style.backgroundImage = "url('" + CONFIG.heroImg + "')"; }
  else if (CONFIG.heroArte) { $("heroArt").classList.add("foto"); if (!CONFIG.heroPegado) $("heroArt").classList.add("libre"); $("heroArt").innerHTML = '<span><img src="' + esc(CONFIG.heroArte) + '" alt="" onerror="this.parentNode.style.display=\'none\'">' + salsaSVG() + '</span>'; }
  else $("heroArt").innerHTML = "<span>" + CONFIG.logoEmoji + "</span>";
  $("eyebrow").textContent = CONFIG.eslogan;
  $("brand").textContent = CONFIG.nombre;
  var l2 = CONFIG.tituloHero[1].replace(/\.$/, "");
  var w = 0, palabras = function (txt, cls) { return txt.split(/\s+/).map(function (p) { return '<span class="pal ' + (cls || "") + '" style="animation-delay:' + (0.25 + (w++) * 0.14).toFixed(2) + 's">' + esc(p) + "</span>"; }).join(" "); };
  $("h1").innerHTML = palabras(CONFIG.tituloHero[0]) + "<br>" + palabras(l2, "grad") + '<span class="pal dot" style="animation-delay:' + (0.25 + w * 0.14).toFixed(2) + 's">.</span>';
  var pista = function (arr) { var s = '<div class="pista">' + arr.map(function (t) { return "<span>" + esc(t) + "</span>"; }).join("") + "</div>"; return s + s + s; };
  $("cintaA").innerHTML = pista(CONFIG.cintas.amarilla); $("cintaR").innerHTML = pista(CONFIG.cintas.roja);
  $("sub").textContent = CONFIG.subtitulo;
  $("dir").textContent = "📍 " + CONFIG.direccion;
  $("links").innerHTML =
    '<a class="chip" href="https://wa.me/' + CONFIG.whatsapp + '" target="_blank" rel="noopener">💬 WhatsApp</a>' +
    '<a class="chip" href="' + esc(CONFIG.mapsUrl) + '" target="_blank" rel="noopener">🗺️ Cómo llegar</a>' +
    (CONFIG.instagram ? '<a class="chip" href="' + esc(CONFIG.instagram) + '" target="_blank" rel="noopener">📸 Instagram</a>' : "") +
    (CONFIG.tiktok ? '<a class="chip" href="' + esc(CONFIG.tiktok) + '" target="_blank" rel="noopener">🎵 TikTok</a>' : "");
  if (CONFIG.demo) {
    var wl = "https://wa.me/" + CONFIG.demo.whatsapp + "?text=" + encodeURIComponent(CONFIG.demo.mensaje);
    $("demoBar").hidden = false; $("demoBar").href = wl;
    $("demoBar").innerHTML = "<span>🧪 " + esc(CONFIG.demo.texto) + "</span><b>Escríbeme →</b>";
  }
  $("foot").textContent = "© " + new Date().getFullYear() + " · " + CONFIG.nombre + " · " + CONFIG.eslogan.toUpperCase();
  document.title = CONFIG.nombre + " · Menú";
  if (CONFIG.demo) $("foot").innerHTML = esc($("foot").textContent) + '<br><a class="credito" target="_blank" rel="noopener" href="https://wa.me/' + CONFIG.demo.whatsapp + "?text=" + encodeURIComponent(CONFIG.demo.mensaje) + '">Menú digital hecho por ' + esc(CONFIG.demo.marca) + " · ¿Quieres uno?</a>";

  $("cats").innerHTML = MENU.map(function (c) { return '<a class="cat" href="#' + c.id + '" data-c="' + c.id + '">' + esc(c.t) + "</a>"; }).join("");
  $("menu").innerHTML = MENU.map(function (c) {
    return '<section class="sec" id="' + c.id + '"><div class="sec-label">' + esc(c.label) + '</div><h2 class="sec-title">' + esc(c.t) + '</h2><div class="sec-line"></div>' +
      (c.intro ? '<p class="sec-intro">' + esc(c.intro) + "</p>" : "") + '<div class="grid">' +
      c.items.map(function (it) {
        var b = it.badge ? '<span class="badge' + (/nuevo/i.test(it.badge) ? " nuevo" : "") + '">' + esc(it.badge) + "</span>" : "";
        return '<div class="item' + (it.badge && !/nuevo/i.test(it.badge) ? " fav" : "") + (it.agotado ? " out" : "") + '" data-card="' + esc(it.n) + '">' +
          '<div class="thumb">' + foto(it) + "</div>" +
          '<div class="info">' + b + '<div class="iname">' + esc(it.n) + "</div>" + (it.nota ? '<div class="inote">' + esc(it.nota) + "</div>" : "") +
          '<div class="idesc">' + esc(it.d) + "</div>" +
          '<div class="irow"><span class="price">' + money(it.p) + "</span>" +
          (it.agotado ? '<button class="add" disabled>Agotado</button>' : '<button class="add" aria-label="Agregar ' + esc(it.n) + '" data-n="' + esc(it.n) + '">+</button>') +
          "</div></div></div>";
      }).join("") + "</div></section>";
  }).join("");
}

/* chorros de salsa que fluyen sobre la foto de portada */
function salsaSVG() {
  var s = CONFIG.heroSalsa; if (!s) return "";
  var h = '<svg class="salsa" viewBox="0 0 ' + s.ancho + " " + s.alto + '" preserveAspectRatio="none" aria-hidden="true">' +
    '<defs><filter id="liq" x="-50%" y="-5%" width="200%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.035" numOctaves="2" seed="3" result="r">' +
    '<animate attributeName="baseFrequency" dur="3s" values="0.012 0.035;0.016 0.05;0.012 0.035" repeatCount="indefinite"/></feTurbulence>' +
    '<feDisplacementMap in="SourceGraphic" in2="r" scale="7" xChannelSelector="R" yChannelSelector="G"/></filter>' +
    '<linearGradient id="caida" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="' + s.color + '" stop-opacity="0"/><stop offset=".12" stop-color="' + s.color + '"/><stop offset="1" stop-color="' + s.color + '"/></linearGradient></defs>';
  s.chorros.forEach(function (c, i) {
    var d = "M" + c[0] + " " + c[1] + " C" + (c[0] - 4) + " " + (c[1] + (c[3] - c[1]) * .4) + " " + (c[2] + 3) + " " + (c[1] + (c[3] - c[1]) * .7) + " " + c[2] + " " + c[3];
    var del = (-i * .27).toFixed(2) + "s";
    h += '<g filter="url(#liq)">' +
      '<ellipse class="charco" cx="' + c[2] + '" cy="' + (c[3] + 4) + '" rx="' + c[4] * 1.6 + '" ry="' + c[4] * .55 + '" fill="' + s.color + '" style="animation-delay:' + del + '"/>' +
      '<path d="' + d + '" stroke="url(#caida)" stroke-width="' + c[4] + '" stroke-linecap="round" fill="none"/>' +
      '<path class="gota" d="' + d + '" stroke="' + s.color + '" stroke-width="' + c[4] * 1.45 + '" stroke-linecap="round" fill="none" style="animation-delay:' + del + '"/>' +
      '<path class="brillo" d="' + d + '" stroke="' + s.brillo + '" stroke-opacity=".75" stroke-width="' + c[4] * .28 + '" stroke-linecap="round" fill="none" transform="translate(' + (-c[4] * .22) + ' 0)" style="animation-delay:' + del + '"/>' +
      '</g>' +
      '<circle r="' + c[4] * .5 + '" fill="' + s.color + '" opacity="0">' +
        '<animateMotion dur="1.6s" repeatCount="indefinite" begin="' + (i * .5 + .2).toFixed(2) + 's" path="' + d + '" keyPoints="0;1" keyTimes="0;1" calcMode="spline" keySplines=".55 0 1 .45"/>' +
        '<animate attributeName="opacity" dur="1.6s" repeatCount="indefinite" begin="' + (i * .5 + .2).toFixed(2) + 's" values="0;1;1;0" keyTimes="0;.15;.9;1"/></circle>';
  });
  return h + "</svg>";
}

/* animación de entrada + categoría activa */
function observar() {
  var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("vis"); io.unobserve(e.target); } }); }, { threshold: .12 });
  document.querySelectorAll(".item").forEach(function (el, i) { el.style.transitionDelay = (i % 4) * 70 + "ms"; io.observe(el); el.addEventListener("transitionend", function f(ev) { if (ev.propertyName === "opacity") { el.style.transitionDelay = ""; el.removeEventListener("transitionend", f); } }); });
  document.querySelectorAll(".sec").forEach(function (el) { io.observe(el); });
  var secs = MENU.map(function (c) { return $(c.id); });
  var activa = "";
  window.addEventListener("scroll", function () {
    var y = window.scrollY + 140, cur = "";
    secs.forEach(function (s) { if (s.offsetTop <= y) cur = s.id; });
    if (cur !== activa) {
      activa = cur;
      document.querySelectorAll(".cat").forEach(function (a) {
        var on = a.dataset.c === cur; a.classList.toggle("on", on);
        if (on) { var cats = $("cats"); cats.scrollTo({ left: a.offsetLeft - cats.offsetWidth / 2 + a.offsetWidth / 2, behavior: "smooth" }); }
      });
    }
  }, { passive: true });
}

/* ═════════ CARRITO (estado) ═════════ */
var S = store.get("menu_estado_v1") || {};
var cart = S.cart || [];
var tipo = S.tipo || "domicilio";
var pago = S.pago || "";
var datos = S.datos || { nombre: "", tel: "", dir: "", hora: "", notas: "", conCuanto: "", exacto: true };
cart = cart.filter(function (l) { return ITEMS[l.n] && !ITEMS[l.n].agotado; });
function guardar() { store.set("menu_estado_v1", { cart: cart, tipo: tipo, pago: pago, datos: datos }); }
function subtotal() { return cart.reduce(function (s, l) { return s + l.u * l.q; }, 0); }
function envio() { return tipo === "domicilio" && cart.length ? (CONFIG.costoEnvio || 0) : 0; }
function envioPend() { return tipo === "domicilio" && CONFIG.costoEnvio == null; }
function total() { return subtotal() + envio(); }
function piezas() { return cart.reduce(function (s, l) { return s + l.q; }, 0); }

function agregarLinea(n, ops, unit, q, origen) {
  var key = n + "|" + ops.join("|");
  var ex = cart.find(function (l) { return l.k === key; });
  if (ex) ex.q += q; else cart.push({ k: key, n: n, ops: ops, u: unit, q: q });
  guardar(); pintarBarra(true); toast(n + " agregado ✓");
  if (origen) efectoAgregar(origen, q);
  if (navigator.vibrate) try { navigator.vibrate(12); } catch (e) {}
}
function pintarBarra(bump) {
  var b = $("bar"), n = piezas();
  b.classList.toggle("show", n > 0);
  $("barN").textContent = n; $("barT").textContent = money(total());
  if (bump) { b.classList.remove("bump"); void b.offsetWidth; b.classList.add("bump"); }
}
var tT;
function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("show"); clearTimeout(tT); tT = setTimeout(function () { el.classList.remove("show"); }, 1600); }

/* ═════════ FICHA ═════════ */
var F = null;
function tocarMas(n, btn) {
  var it = ITEMS[n]; if (!it || it.agotado) return;
  if (!it.opciones && !it.extras) { agregarLinea(n, [], it.p, 1, btn); return; }
  abrirFicha(n);
}
function abrirFicha(n, desde) {
  var it = ITEMS[n];
  F = { it: it, q: 1, sel: (it.opciones || []).map(function () { return -1; }), ext: (it.extras || []).map(function () { return false; }) };
  pintarFicha(); abrir("ficha");
  $("fBody").scrollTop = 0;
  if (desde && !QUIETO) crecer(desde, it);
}
/* la foto "vuela" desde la tarjeta hasta la ficha */
function crecer(desde, it) {
  var dest = [$("fMedia").querySelector(".f-img"), $("fBody").querySelector(".f-img")].filter(function (d) { return d && d.offsetParent; })[0]; if (!dest) return;
  var r = desde.getBoundingClientRect(), g = document.createElement("div");
  g.className = "ghost"; g.innerHTML = foto(it);
  g.style.cssText = "left:" + r.left + "px;top:" + r.top + "px;width:" + r.width + "px;height:" + r.height + "px;font-size:" + (r.height * .5) + "px";
  document.body.appendChild(g); dest.style.visibility = "hidden";
  // posición final de la foto (la ficha todavía viene entrando, así que se calcula sin su animación)
  var sh = $("ficha"), sr = sh.getBoundingClientRect(), d = dest.getBoundingClientRect(), s = sr.width / sh.offsetWidth || 1;
  var fx = sh.offsetLeft + (d.left - sr.left) / s, fy = sh.offsetTop + (d.top - sr.top) / s;
  setTimeout(function () {
    g.style.left = fx + "px"; g.style.top = fy + "px"; g.style.width = d.width / s + "px"; g.style.height = d.height / s + "px"; g.style.borderRadius = "18px"; g.style.fontSize = (d.height / s * .52) + "px";
  }, 20);
  setTimeout(function () { dest.style.visibility = ""; g.remove(); }, 520);
}
function pintarFicha() {
  var it = F.it, cat = catDe(it), h = '<div class="f-img">' + foto(it) + '</div><div class="f-top"><span class="f-cat">' + esc(cat) + '</span>' + (it.badge ? '<span class="f-badge">' + esc(it.badge) + '</span>' : "") + '</div><div class="f-name">' + esc(it.n) + "</div>" + (it.nota ? '<div class="inote">' + esc(it.nota) + "</div>" : "") + '<p class="f-desc">' + esc(it.d) + "</p>";
  (it.opciones || []).forEach(function (g, gi) {
    h += '<div class="grp"><div class="grp-t">' + esc(g.t) + '<span class="req">Elige 1</span></div>' + g.c.map(function (c, ci) {
      return '<button class="opt' + (F.sel[gi] === ci ? " on" : "") + '" onclick="fSel(' + gi + "," + ci + ')"><span class="l"><span class="ck"></span>' + esc(c.n) + '</span><span class="xp">' + (c.x ? "+" + money(c.x) : "") + "</span></button>";
    }).join("") + "</div>";
  });
  if (it.extras) h += '<div class="grp"><div class="grp-t">Extras<span class="req" style="color:var(--muted)">Opcional</span></div>' + it.extras.map(function (x, xi) {
    return '<button class="opt multi' + (F.ext[xi] ? " on" : "") + '" onclick="fExt(' + xi + ')"><span class="l"><span class="ck"></span>' + esc(x.n) + '</span><span class="xp">+' + money(x.x) + "</span></button>";
  }).join("") + "</div>";
  $("fBody").innerHTML = h; $("fQ").textContent = F.q;
  var fm = $("fMedia"); if (fm.dataset.n !== it.n) { fm.dataset.n = it.n; fm.innerHTML = '<div class="f-img">' + foto(it) + '<span class="f-zoom" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4M11 8v6M8 11h6"/></svg></span></div>'; }
  var ok = F.sel.every(function (s) { return s > -1; });
  $("fAdd").setAttribute("aria-disabled", !ok);
  $("fAdd").innerHTML = ok ? "<span>Agregar</span><span>" + money(fUnit() * F.q) + "</span>" : "Elige tus opciones"; $("fAdd").classList.toggle("dos", ok);
}
function catDe(it) { var c = ""; MENU.forEach(function (k) { if (!c && k.items.indexOf(it) > -1) c = k.t; }); return c; }
function fUnit() {
  var u = F.it.p;
  (F.it.opciones || []).forEach(function (g, gi) { var c = g.c[F.sel[gi]]; if (c && c.x) u += c.x; });
  (F.it.extras || []).forEach(function (x, xi) { if (F.ext[xi]) u += x.x; });
  return u;
}
function fSel(g, c) { F.sel[g] = c; var y = $("fBody").scrollTop; pintarFicha(); $("fBody").scrollTop = y; }
function fExt(x) { F.ext[x] = !F.ext[x]; var y = $("fBody").scrollTop; pintarFicha(); $("fBody").scrollTop = y; }
function fQty(d) { F.q = Math.max(1, F.q + d); pintarFicha(); }
function fAgregar() {
  if (!F.sel.every(function (s) { return s > -1; })) return;
  var ops = [];
  (F.it.opciones || []).forEach(function (g, gi) { ops.push(g.t + ": " + g.c[F.sel[gi]].n); });
  (F.it.extras || []).forEach(function (x, xi) { if (F.ext[xi]) ops.push("+ " + x.n); });
  agregarLinea(F.it.n, ops, fUnit(), F.q, $("fAdd"));
  cerrarTodo();
  if ($("cart").dataset.volver === "1") { $("cart").dataset.volver = ""; setTimeout(abrirCarrito, 350); }
}

/* ═════════ HOJAS ═════════ */
function abrir(id) { $("ov").classList.add("show"); $(id).classList.add("show"); document.body.classList.add("lock"); }
function cerrarTodo() { ["ficha", "cart"].forEach(function (i) { $(i).classList.remove("show"); }); $("ov").classList.remove("show"); document.body.classList.remove("lock"); }
document.addEventListener("keydown", function (e) { if (e.key === "Escape") cerrarTodo(); });

/* ═════════ CARRITO (vista) ═════════ */
function abrirCarrito() { pintarCarrito(); abrir("cart"); }
function pintarCarrito() {
  var b = "";
  b += '<div class="seg"><button class="' + (tipo === "domicilio" ? "on" : "") + '" onclick="setTipo(\'domicilio\')"><span class="ic">🛵</span>Domicilio</button><button class="' + (tipo === "recoger" ? "on" : "") + '" onclick="setTipo(\'recoger\')"><span class="ic">🛍️</span>Recoger</button></div>';
  b += '<div class="lbl">' + (tipo === "domicilio" ? "Datos para envío" : "Datos para recoger") + "</div>";
  b += '<input class="in" id="iNom" placeholder="Tu nombre" autocomplete="name" value="' + esc(datos.nombre) + '" oninput="setD(\'nombre\',this.value)">';
  b += '<input class="in" id="iTel" placeholder="WhatsApp a 10 dígitos" inputmode="numeric" maxlength="10" autocomplete="tel-national" value="' + esc(datos.tel) + '" oninput="this.value=this.value.replace(/\\D/g,\'\');setD(\'tel\',this.value)">';
  if (tipo === "domicilio") {
    b += datos.ubic
      ? '<div class="ubic ok"><span class="ic">📍</span><span>Ubicación guardada<small>Se enviará en tu pedido · ±' + datos.ubic.prec + ' m</small></span><button class="q" onclick="quitarUbicacion()">Quitar</button></div>'
      : '<button class="ubic" id="btnUbic" onclick="usarUbicacion()"><span class="ic">📍</span><span>Usar mi ubicación actual<small>Mandamos tu ubicación exacta al repartidor</small></span></button>'+ (UBIC_MSG ? '<p class="ubic-msg">' + esc(UBIC_MSG) + '</p>' : '');
    b += '<textarea class="in" id="iDir" placeholder="' + (datos.ubic ? "Referencias: color de casa, entre calles, # interior" : "Calle, número, colonia y referencias") + '" autocomplete="street-address" oninput="setD(\'dir\',this.value)">' + esc(datos.dir) + "</textarea>";
  }
  else {
    b += '<input class="in" id="iHora" placeholder="¿A qué hora pasas? (ej. 8:30 pm)" value="' + esc(datos.hora) + '" oninput="setD(\'hora\',this.value)">';
    b += '<div class="local"><div class="local-dir"><span>📍 ' + esc(CONFIG.direccion) + '</span><button class="ver-mapa" onclick="verMapa(this)">' + (MAPA_ABIERTO ? "Ocultar mapa" : "Ver ubicación") + '</button></div>' +
      (MAPA_ABIERTO ? '<div class="mapa"><iframe src="https://www.google.com/maps?q=' + encodeURIComponent(CONFIG.mapaBusqueda || (CONFIG.nombre + ", " + CONFIG.direccion)) + '&z=16&output=embed" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="Mapa"></iframe></div>' +
      '<a class="abrir-maps" href="' + esc(CONFIG.mapsUrl) + '" target="_blank" rel="noopener">🗺️ Abrir en Google Maps para cómo llegar</a>' : "") + "</div>";
  }

  b += '<div class="lbl">Tu pedido</div>';
  if (!cart.length) {
    b += '<div class="empty"><div class="big">🥢</div>Aún no agregas nada.<br>Toca el <b style="color:var(--cta)">+</b> de cualquier platillo.</div>';
    var ult = store.get("menu_ultimo_v1");
    if (ult && ult.length) b += '<button class="repeat" id="repetir">🔁 Repetir mi último pedido <span style="color:var(--muted);font-weight:500;margin-left:auto">' + ult.reduce(function (s, l) { return s + l.q; }, 0) + " pzs</span></button>";
  }
  cart.forEach(function (l, i) {
    b += '<div class="ci"><div class="ce">' + foto(ITEMS[l.n]) + '</div><div class="cn">' + esc(l.n) + (l.ops.length ? '<div class="co">' + l.ops.map(esc).join(" · ") + "</div>" : "") + '</div><div class="qty"><button onclick="cQ(' + i + ',-1)" aria-label="Quitar">' + (l.q === 1 ? "🗑" : "−") + "</button><span>" + l.q + '</span><button onclick="cQ(' + i + ',1)" aria-label="Agregar uno">+</button></div><div class="cp">' + money(l.u * l.q) + "</div></div>";
  });

  var sug = [];
  MENU.forEach(function (c) { c.items.forEach(function (it) { if (it.sugerido && !it.agotado && !cart.some(function (l) { return l.n === it.n; })) sug.push(it); }); });
  if (cart.length && sug.length) {
    b += '<div class="lbl">¿Le agregas algo más?</div><div class="ups">' + sug.map(function (it) {
      return '<button class="up" data-up="' + esc(it.n) + '"><div class="ue">' + foto(it) + '</div><div class="un">' + esc(it.n) + '</div><div class="upr">+ ' + money(it.p) + "</div></button>";
    }).join("") + "</div>";
  }

  if (cart.length) {
    b += '<div class="lbl">Notas del pedido</div><textarea class="in" placeholder="Sin cebolla, salsas aparte, etc. (opcional)" oninput="setD(\'notas\',this.value)">' + esc(datos.notas) + "</textarea>";
    b += '<div class="lbl">¿Cómo pagas?</div><div class="pay"><button class="' + (pago === "efectivo" ? "on" : "") + '" onclick="setPago(\'efectivo\')"><span class="ic">💵</span>Efectivo</button><button class="' + (pago === "transferencia" ? "on" : "") + '" onclick="setPago(\'transferencia\')"><span class="ic">🏦</span>Transferencia</button></div>';

    }

      b += '<div class="subbox">Transfiere <b>' + money(total()) + (envioPend() ? " + envío" : "") + "</b>" + (envioPend() ? " (te confirmamos el envío por WhatsApp)" : "") + " a:<div class=\"clabe\"><span>" + esc(t.clabe.replace(/(\d{4})(?=\d)/g, "$1 ")) + '</span><button class="copy" onclick="copiar(this)">Copiar</button></div>' + esc(t.banco) + " · " + esc(t.titular) + '<div style="margin-top:8px;color:var(--acc);font-size:13px">📎 Mándanos tu comprobante por WhatsApp junto con tu pedido.</div></div>';
    }
  }
  $("cBody").innerHTML = b;
  pintarPie();
}
function pintarPie() {
  var e = estado(), f = "";
  if (cart.length) {
    f += '<div class="tot-l"><span>Subtotal</span><span>' + money(subtotal()) + "</span></div>";
    if (tipo === "domicilio") f += '<div class="tot-l"><span>Envío a domicilio</span><span>' + (envioPend() ? "Según ubicación" : "+" + money(envio())) + "</span></div>";
    f += '<div class="tot-l big"><span>Total' + (envioPend() ? " + envío" : "") + '</span><span>' + money(total()) + "</span></div>";
  }
  var falta = validar();
  if (!e.abierto && CONFIG.bloquearCerrado) f += '<div class="warn"><span class="d"></span><span>Estamos cerrados. ' + esc(e.txt) + ".</span></div>";
  var ok = !falta && (e.abierto || !CONFIG.bloquearCerrado);
  f += '<a class="btn wa" id="send" target="_blank" rel="noopener" aria-disabled="' + !ok + '" href="' + (ok ? "https://wa.me/" + CONFIG.whatsapp + "?text=" + encodeURIComponent(mensaje()) : "#") + '" onclick="return enviar(event)">💬 Enviar pedido por WhatsApp</a>';
  f += '<p class="hint">' + (falta && (e.abierto || !CONFIG.bloquearCerrado) ? "Falta: " + falta : "Te confirmamos tu pedido por WhatsApp") + "</p>";
  $("cFoot").innerHTML = f;
}
function validar() {
  if (!cart.length) return "agregar platillos";
  if (CONFIG.pedidoMinimo && subtotal() < CONFIG.pedidoMinimo) return "pedido mínimo de " + money(CONFIG.pedidoMinimo);
  if (!datos.nombre.trim()) return "tu nombre";
  if (datos.tel.length !== 10) return "tu WhatsApp a 10 dígitos";
  if (tipo === "domicilio" && !datos.ubic && datos.dir.trim().length < 8) return "tu dirección o ubicación";
  if (tipo === "recoger" && !datos.hora.trim()) return "la hora en que pasas";
  if (!pago) return "elegir cómo pagas";
  if (pago === "efectivo" && !datos.exacto && (+datos.conCuanto || 0) < total()) return "con cuánto pagas (mayor al total)";
  return "";
}
function mapsLink() { return "https://www.google.com/maps/search/?api=1&query=" + datos.ubic.lat + "," + datos.ubic.lng; }
function cobro() {
  if (pago === "efectivo") return "💵 Cobrar " + money(total()) + (envioPend() ? " + envío" : "") + (datos.exacto ? " (pago exacto)" : " · paga con " + money(+datos.conCuanto) + " → cambio " + money(+datos.conCuanto - total()) + (envioPend() ? " (sin contar envío)" : ""));
  return "🏦 Pagado por transferencia (verificar comprobante)";
}
function mensaje() {
  var L = [];
  L.push("*Nuevo pedido · " + CONFIG.nombre + "*");
  L.push(tipo === "domicilio" ? "🛵 *A domicilio*" : "🛍️ *Para recoger*");
  L.push("");
  cart.forEach(function (l) {
    L.push(l.q + "x " + l.n + " — " + money(l.u * l.q));
    l.ops.forEach(function (o) { L.push("   • " + o); });
  });
  L.push("");
  L.push("Subtotal: " + money(subtotal()));
  if (tipo === "domicilio") L.push("Envío: " + (envioPend() ? "por confirmar según ubicación" : money(envio())));
  L.push("*Total: " + money(total()) + (envioPend() ? " + envío" : "") + "*");
  L.push("");
  if (pago === "efectivo") L.push("💵 Pago: Efectivo" + (datos.exacto ? " (exacto)" : " — paga con " + money(+datos.conCuanto) + ", cambio " + money(+datos.conCuanto - total())));
  else L.push("🏦 Pago: Transferencia (envío comprobante)");
  if (datos.notas.trim()) L.push("📝 Notas: " + datos.notas.trim());
  L.push("");
  if (tipo === "domicilio") {
    // bloque listo para reenviar al repartidor
    L.push("━━━━━━━━━━━━");
    L.push("🛵 *PARA EL REPARTIDOR*");
    L.push("👤 " + datos.nombre.trim());
    L.push("📱 " + datos.tel);
    if (datos.dir.trim()) L.push("📍 " + datos.dir.trim());
    if (datos.ubic) L.push("🗺️ " + mapsLink());
    L.push(cobro());
    L.push("━━━━━━━━━━━━");
  } else {
    L.push("👤 " + datos.nombre.trim());
    L.push("📱 " + datos.tel);
    L.push("🕑 Paso a las: " + datos.hora.trim());
  }
  return L.join("\n");
}
function enviar(ev) {
  var el = $("send");
  if (el.getAttribute("aria-disabled") === "true") { ev.preventDefault(); marcarError(); return false; }
  store.set("menu_ultimo_v1", cart);
  setTimeout(function () { toast("Abriendo WhatsApp…"); }, 50);
  return true;
}
function marcarError() {
  var f = validar(), id = { "tu nombre": "iNom", "tu WhatsApp a 10 dígitos": "iTel", "tu dirección o ubicación": "iDir", "la hora en que pasas": "iHora" }[f];
  if (/cuánto/.test(f)) id = "iCash";
  if (id && $(id)) { $(id).classList.add("err"); $(id).focus(); }
}
function setTipo(t) { tipo = t; guardar(); pintarCarrito(); pintarBarra(); }
function setPago(p) { pago = p; guardar(); pintarCarrito(); }
function setExacto(v) { datos.exacto = v; guardar(); pintarCarrito(); }
function setD(k, v) { datos[k] = v; guardar(); var a = document.activeElement; if (a) a.classList.remove("err"); pintarPie(); }
/* ubicación actual del cliente (se guarda en su teléfono para el próximo pedido) */
var UBIC_MSG = "";
function usarUbicacion() {
  UBIC_MSG = "";
  if (!window.isSecureContext) { UBIC_MSG = "La ubicación solo funciona cuando el menú está publicado en internet (https). Por ahora escribe tu dirección."; pintarCarrito(); return; }
  if (!navigator.geolocation) { UBIC_MSG = "Tu navegador no comparte ubicación. Escribe tu dirección y referencias."; pintarCarrito(); return; }
  var btn = $("btnUbic"); if (btn) btn.classList.add("cargando");
  navigator.geolocation.getCurrentPosition(function (p) {
    datos.ubic = { lat: p.coords.latitude.toFixed(6), lng: p.coords.longitude.toFixed(6), prec: Math.round(p.coords.accuracy) };
    UBIC_MSG = ""; guardar(); pintarCarrito(); toast("Ubicación guardada ✓");
  }, function (e) {
    if (btn) btn.classList.remove("cargando");
    UBIC_MSG = e.code === 1
      ? "Bloqueaste la ubicación. Actívala en tu navegador (ícono aA o candado junto a la dirección → Ubicación → Permitir) y vuelve a tocar el botón."
      : "No pudimos obtener tu ubicación. Revisa que el GPS esté prendido o escribe tu dirección.";
    pintarCarrito();
  }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
}
var MAPA_ABIERTO = false;
function verMapa() { MAPA_ABIERTO = !MAPA_ABIERTO; var y = $("cBody").scrollTop; pintarCarrito(); $("cBody").scrollTop = y; }
function quitarUbicacion() { datos.ubic = null; guardar(); pintarCarrito(); }
function cQ(i, d) { cart[i].q += d; if (cart[i].q < 1) cart.splice(i, 1); guardar(); pintarCarrito(); pintarBarra(); }
function copiar(btn) {
  var v = CONFIG.transferencia.clabe;
  var ok = function () { btn.textContent = "¡Copiada!"; setTimeout(function () { btn.textContent = "Copiar"; }, 1500); };
  try { navigator.clipboard.writeText(v).then(ok, function () { btn.textContent = v; }); } catch (e) { btn.textContent = v; }
}

function repetir() {
  var ult = store.get("menu_ultimo_v1") || [];
  ult.forEach(function (l) { var it = ITEMS[l.n]; if (it && !it.agotado) cart.push(l); });
  guardar(); pintarCarrito(); pintarBarra(true); toast("Listo, ya está tu pedido de siempre");
}

/* ═════════ EFECTOS ═════════ */
var QUIETO = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
var TACTIL = window.matchMedia && matchMedia("(hover: none), (pointer: coarse)").matches;

function efectoAgregar(el, q) {
  if (QUIETO) return;
  var r = el.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
  if (el.classList.contains("add")) { el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop"); }
  var o = document.createElement("span"); o.className = "onda"; o.style.left = x + "px"; o.style.top = y + "px"; document.body.appendChild(o);
  setTimeout(function () { o.remove(); }, 650);
  var cs = getComputedStyle(document.documentElement), cols = [cs.getPropertyValue("--acc"), cs.getPropertyValue("--cta")];
  for (var i = 0; i < 12; i++) (function (i) {
    var s = document.createElement("span"); s.className = "chispa"; s.style.left = x + "px"; s.style.top = y + "px"; s.style.background = cols[i % 2];
    document.body.appendChild(s);
    var a = (i / 12) * 6.283 + Math.random() * .4, d = 30 + Math.random() * 34;
    requestAnimationFrame(function () { requestAnimationFrame(function () { s.style.transform = "translate(" + Math.cos(a) * d + "px," + Math.sin(a) * d + "px) scale(.3)"; s.style.opacity = "0"; }); });
    setTimeout(function () { s.remove(); }, 650);
  })(i);
  var v = document.createElement("span"); v.className = "vuela"; v.textContent = "+" + q;
  v.style.left = (x - 16) + "px"; v.style.top = (y - 14) + "px"; document.body.appendChild(v);
  setTimeout(function () {
    var br = $("barN").getBoundingClientRect(), tx = br.width ? br.left + br.width / 2 - x : 0, ty = br.width ? br.top + br.height / 2 - y : -70;
    requestAnimationFrame(function () { v.style.transform = "translate(" + tx + "px," + ty + "px) scale(.5)"; v.style.opacity = "0"; });
    setTimeout(function () { v.remove(); var b = $("bar"); b.classList.remove("brinca"); void b.offsetWidth; b.classList.add("brinca"); }, 760);
  }, 60);
}

function efectos() {
  // barra de progreso
  var prog = $("prog");
  var pinta = function () { var hh = document.documentElement.scrollHeight - innerHeight; prog.style.transform = "scaleX(" + (hh > 0 ? scrollY / hh : 0) + ")"; };
  addEventListener("scroll", pinta, { passive: true }); pinta();
  if (QUIETO) return;
  // luz que sigue al cursor + emoji que se inclina
  var hero = document.querySelector(".hero"), art = document.querySelector("#heroArt:not(.foto) span");
  hero.addEventListener("pointermove", function (e) {
    var r = hero.getBoundingClientRect();
    hero.style.setProperty("--mx", (e.clientX - r.left) + "px"); hero.style.setProperty("--my", (e.clientY - r.top) + "px");
    if (art && !TACTIL) { var x = (e.clientX - r.left) / r.width - .5, y = (e.clientY - r.top) / r.height - .5; art.style.transform = "rotateY(" + (x * 26).toFixed(1) + "deg) rotateX(" + (-y * 18).toFixed(1) + "deg)"; }
  });
  hero.addEventListener("pointerleave", function () { if (art) art.style.transform = ""; });
  // botón magnético
  if (!TACTIL) document.querySelectorAll(".hero-cta").forEach(function (b) {
    b.addEventListener("pointermove", function (e) { var r = b.getBoundingClientRect(); b.style.transform = "translate(" + ((e.clientX - r.left - r.width / 2) * .18).toFixed(1) + "px," + ((e.clientY - r.top - r.height / 2) * .3).toFixed(1) + "px)"; });
    b.addEventListener("pointerleave", function () { b.style.transform = ""; });
  });
  // luz bajo el cursor en tarjetas
  document.addEventListener("pointermove", function (e) {
    var c = e.target.closest && e.target.closest(".item"); if (!c) return;
    var r = c.getBoundingClientRect(); c.style.setProperty("--x", (e.clientX - r.left) + "px"); c.style.setProperty("--y", (e.clientY - r.top) + "px");
  }, { passive: true });
  // partículas tipo brasas en la portada
  var cv = $("chispas"), ctx = cv.getContext("2d"), P = [], W, H, dpr = Math.min(devicePixelRatio || 1, 2), vivo = true;
  var cs = getComputedStyle(document.documentElement), C1 = cs.getPropertyValue("--acc").trim(), C2 = cs.getPropertyValue("--cta").trim();
  var tam = function () { W = cv.offsetWidth; H = cv.offsetHeight; cv.width = W * dpr; cv.height = H * dpr; ctx.setTransform(dpr, 0, 0, dpr, 0, 0); };
  tam(); addEventListener("resize", tam);
  var nueva = function (inicio) { return { x: Math.random() * W, y: inicio ? Math.random() * H : H + 10, r: Math.random() * 2.2 + .6, vy: Math.random() * .6 + .25, vx: (Math.random() - .5) * .3, f: Math.random() * 6.28, c: Math.random() < .6 ? C1 : C2, a: Math.random() * .6 + .35 }; };
  var N = TACTIL ? 38 : 70; for (var i = 0; i < N; i++) P.push(nueva(true));
  new IntersectionObserver(function (es) { vivo = es[0].isIntersecting; if (vivo) requestAnimationFrame(cuadro); }).observe(hero);
  function cuadro() {
    if (!vivo) return;
    ctx.clearRect(0, 0, W, H);
    P.forEach(function (p, i) {
      p.y -= p.vy; p.f += .02; p.x += p.vx + Math.sin(p.f) * .25;
      var fade = Math.min(1, p.y / (H * .35));
      if (p.y < -10) P[i] = nueva(false);
      ctx.globalAlpha = p.a * fade; ctx.fillStyle = p.c; ctx.shadowColor = p.c; ctx.shadowBlur = 8;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    });
    requestAnimationFrame(cuadro);
  }
}

/* ═════════ EVENTOS ═════════ */
document.addEventListener("click", function (e) {
  var a = e.target.closest(".add[data-n]"); if (a) { tocarMas(a.dataset.n, a); return; }
  var card = e.target.closest(".item[data-card]");
  if (card && !card.classList.contains("out")) { abrirFicha(card.dataset.card, card.querySelector(".thumb")); return; }
  if (card) { toast(card.dataset.card + " se acabó por hoy"); return; }
  var fi = e.target.closest(".f-img"); if (fi) { fi.classList.toggle("zoom"); return; }
  var rp = e.target.closest("#repetir"); if (rp) { repetir(); return; }
  var u = e.target.closest("[data-up]");
  if (u) {
    var it = ITEMS[u.dataset.up];
    if (it.opciones || it.extras) { $("cart").classList.remove("show"); $("cart").dataset.volver = "1"; abrirFicha(it.n); }
    else { agregarLinea(it.n, [], it.p, 1, u); pintarCarrito(); }
  }
});

pintar(); pintarEstado(); observar(); pintarBarra(); efectos();
setInterval(pintarEstado, 60000);
</script>
